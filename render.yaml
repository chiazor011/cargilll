services:
  - type: web
    name: cargill-institutional
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/platform.db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: AdminPass123!
      - key: DEMO_PASSWORD
        value: DemoPass123!
      - key: GEMINI_API_KEY
        sync: false
      # NEW: SMTP for transactional emails
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        value: cargillinvestmentsstake@gmail.com
      # NEW: Ollama Cloud chatbot
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: ministral-3:3b
      # NEW: App URL for email links
      - key: APP_URL
        value: https://cargill-institutional.onrender.com
    # NOTE: Free plan does not support disks, so the SQLite DB is ephemeral.
    # Data will reset on every deploy and after spin-down. Upgrade to a paid
    # plan and uncomment the disk block below to persist data.
    # disk:
    #   name: data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
